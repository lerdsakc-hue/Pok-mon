<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeWord Master - แฟลชการ์ดคำศัพท์</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --pk-blue: #3b4cca;
            --pk-yellow: #ffcb05;
            --pk-red: #cc0000;
            --pk-dark: #1a1a1a;
            --pokedex-red: #dd2020;
            --screen-bg: #98fb98;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #f0f8ff;
            background-image: 
                linear-gradient(rgba(59, 76, 202, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 76, 202, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--pk-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SweetAlert2 Theme */
        .swal2-popup {
            font-family: 'Chakra Petch', sans-serif !important;
            border: 4px solid var(--pk-blue) !important;
            border-radius: 15px !important;
        }
        .swal2-title { color: var(--pk-blue) !important; }
        .swal2-confirm {
            background-color: var(--pk-blue) !important;
            border-radius: 8px !important;
            font-weight: bold !important;
        }
        .swal2-cancel { border-radius: 8px !important; }
        .swal2-confirm.btn-danger { background-color: var(--pk-red) !important; }

        header {
            width: 100%;
            background-color: var(--pk-red);
            color: white;
            text-align: center;
            padding: 15px 0;
            border-bottom: 8px solid #8b0000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 2px;
            color: var(--pk-yellow);
            text-shadow: 3px 3px 0 var(--pk-blue), -1px -1px 0 var(--pk-blue), 1px -1px 0 var(--pk-blue), -1px 1px 0 var(--pk-blue), 1px 1px 0 var(--pk-blue);
        }

        .tabs {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        .tab-btn {
            background-color: white;
            color: var(--pk-blue);
            border: 3px solid var(--pk-blue);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            transition: all 0.2s;
            font-family: 'Chakra Petch', sans-serif;
            box-shadow: 0 4px 0 var(--pk-blue);
        }
        .tab-btn.active, .tab-btn:hover {
            background-color: var(--pk-blue);
            color: var(--pk-yellow);
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e293b;
        }

        .container {
            width: 95%;
            max-width: 900px;
            margin: 20px auto;
            display: none;
        }
        .container.active { display: block; }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--pk-blue);
            box-shadow: 0 8px 0 rgba(59, 76, 202, 0.2);
            margin-bottom: 25px;
        }
        .box h2 {
            color: var(--pk-blue);
            margin-top: 0;
            border-bottom: 3px solid var(--pk-yellow);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--pk-blue); }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: 'Chakra Petch', sans-serif;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--pk-blue);
            box-shadow: 0 0 5px rgba(59, 76, 202, 0.4);
        }

        .deck-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 16px;
        }
        .btn-del-deck {
            background-color: var(--pk-red);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Chakra Petch', sans-serif;
            transition: background 0.2s;
            box-shadow: 0 2px 0 #8b0000;
        }
        .btn-del-deck:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #8b0000;
        }

        .table-responsive {
            overflow-x: auto;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 2px solid var(--pk-blue);
        }
        .word-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            text-align: left;
        }
        .word-table th {
            background-color: var(--pk-blue);
            color: var(--pk-yellow);
            padding: 12px 10px;
            font-size: 15px;
            border: 1px solid #2563eb;
            white-space: nowrap;
        }
        .word-table td {
            padding: 6px;
            border: 1px solid #e2e8f0;
        }
        .word-table input {
            border: 1px solid #cbd5e1;
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
        }
        .word-table input:focus { background-color: #fffbeb; }

        .table-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button.btn-sec {
            background-color: var(--pk-yellow);
            color: var(--pk-dark);
            border: 2px solid #d4af37;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Chakra Petch', sans-serif;
        }
        button.btn-sec:hover { background-color: #fde047; }

        button.btn-del-row {
            background-color: var(--pk-red);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button.btn-main {
            background-color: var(--pk-blue);
            color: var(--pk-yellow);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Chakra Petch', sans-serif;
            box-shadow: 0 4px 0 #1e3a8a;
            transition: transform 0.1s;
        }
        button.btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e3a8a;
        }

        /* ================= โหมด Pokedex ================= */
        #study-area { 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .pokedex-container {
            background-color: var(--pokedex-red);
            padding: 20px;
            border-radius: 15px 15px 30px 15px;
            width: 100%;
            max-width: 380px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 8px 8px 0px rgba(0,0,0,0.1);
            border: 3px solid #8b0000;
            margin-top: 15px;
            position: relative;
        }

        .pokedex-lens {
            width: 50px;
            height: 50px;
            background: radial-gradient(#99ddff 20%, #0077ff 80%);
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            position: relative;
        }
        .pokedex-lens::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
        }

        .pokedex-screen-wrapper {
            background-color: #dfdfdf;
            padding: 15px;
            border-radius: 10px 10px 30px 10px;
            border: 2px solid #555;
            margin-bottom: 15px;
        }

        .pokedex-screen {
            background-color: var(--screen-bg);
            border: 4px solid #555;
            border-radius: 5px;
            padding: 15px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
            position: relative;
            align-items: center; /* จัดให้อยู่ตรงกลาง */
        }

        .dex-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-transform: uppercase;
            width: 100%;
        }

        .main-word-display {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            color: #111;
            margin-top: 20px;
            word-wrap: break-word;
        }

        /* ปุ่มฟังเสียง */
        .speak-btn {
            background-color: var(--pk-blue);
            color: white;
            border: 2px solid #1e3a8a;
            border-radius: 20px;
            padding: 6px 15px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            margin-bottom: 20px;
            font-family: 'Chakra Petch', sans-serif;
            box-shadow: 0 3px 0 #1e3a8a;
            display: none; /* ซ่อนไว้ก่อน จะโชว์เมื่อมีคำศัพท์ */
            transition: transform 0.1s;
        }
        .speak-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #1e3a8a;
        }

        .translation-box {
            display: none;
            width: 100%;
            margin-top: 10px;
            border-top: 2px dashed rgba(0,0,0,0.2);
            padding-top: 15px;
        }

        .data-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .data-label {
            background-color: #333;
            color: white;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            margin-right: 10px;
            min-width: 60px;
            text-align: center;
        }
        .data-val { font-weight: 600; color: #111; }

        .pokedex-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Chakra Petch', sans-serif;
            text-transform: uppercase;
            transition: all 0.1s;
        }
        .action-btn:active { transform: scale(0.95); }
        
        .btn-scan { background-color: var(--pk-yellow); color: var(--pk-dark); box-shadow: 0 4px 0 #a68a00; width: 100%;}
        .btn-scan:active { box-shadow: 0 0 0 #a68a00; }

        .battle-actions { display: none; gap: 10px; width: 100%; }
        .btn-catch { background-color: #22c55e; color: white; flex: 1; box-shadow: 0 4px 0 #166534; }
        .btn-run { background-color: #333; color: white; flex: 1; box-shadow: 0 4px 0 #000; }

    </style>
</head>
<body>

    <header>
        <h1>🔴 PokeWord Master ⚪</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('study')">🎮 โหมดแบทเทิล</button>
        <button class="tab-btn" onclick="switchTab('admin')">⚙️ จัดการ PC Box</button>
    </div>

    <!-- ================= ส่วนของ Admin (PC Box) ================= -->
    <div class="container" id="admin-container">
        
        <div class="box">
            <h2>📦 1. ระบบจัดเก็บเด็ค (PC Box)</h2>
            <div class="form-group">
                <input type="text" id="chapterName" placeholder="เช่น กล่องคำศัพท์ HSK1">
            </div>
            <button class="btn-main" onclick="addChapter()">+ บันทึกกล่องใหม่</button>

            <div style="margin-top: 25px;">
                <label>📋 รายการกล่องเด็คทั้งหมดในระบบ:</label>
                <div id="deckListAdmin">
                    <!-- รายการเด็คจะถูกเพิ่มตรงนี้ -->
                </div>
            </div>
        </div>

        <div class="box">
            <h2>📊 2. ตารางบันทึกข้อมูลคำศัพท์</h2>
            
            <div class="form-group">
                <label>เลือกกล่องเด็คที่ต้องการเพิ่มคำศัพท์:</label>
                <select id="chapterSelectAdmin">
                    <option value="">-- กรุณาเลือกกล่องเด็ค --</option>
                </select>
            </div>

            <div class="table-actions">
                <button class="btn-sec" onclick="addTableRow()">+ เพิ่ม 1 แถว</button>
                <button class="btn-sec" onclick="addMultipleRows(5)">+ เพิ่ม 5 แถว</button>
                <button class="btn-sec" onclick="clearEmptyRows()" style="background-color: #e2e8f0; border-color:#cbd5e1;">🧹 ลบแถวว่าง</button>
            </div>

            <div class="table-responsive">
                <table class="word-table">
                    <thead>
                        <tr>
                            <th style="width: 5%;">#</th>
                            <th style="width: 23%;">คำศัพท์หลัก</th>
                            <th style="width: 23%;">พินอิน/คำอ่าน</th>
                            <th style="width: 23%;">หมวดหมู่/ประเภท</th>
                            <th style="width: 23%;">ความหมาย</th>
                            <th style="width: 3%;">ลบ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- แถวตารางจะถูกสร้างที่นี่ -->
                    </tbody>
                </table>
            </div>

            <button class="btn-main" onclick="saveTableWords()" style="width: 100%; background-color: var(--pk-red); box-shadow: 0 4px 0 #8b0000; color: white;">💾 บันทึกข้อมูลลง Pokedex</button>
        </div>
    </div>

    <!-- ================= ส่วนของการท่องจำ (Pokedex) ================= -->
    <div class="container active" id="study-container">
        <div class="box">
            <h2>🎒 เลือกกล่องเด็คที่จะฝึกฝน</h2>
            <div class="form-group">
                <select id="chapterSelectStudy">
                    <option value="">-- กรุณาเลือกกล่องเด็ค --</option>
                </select>
            </div>
            <button class="btn-main" onclick="startStudy()" style="width: 100%;">เปิด Pokedex 🔍</button>
        </div>

        <div id="study-area" style="display: none;">
            
            <div class="pokedex-container">
                <div class="pokedex-lens"></div>
                
                <div class="pokedex-screen-wrapper">
                    <div class="pokedex-screen">
                        <div class="dex-header">
                            <span>POKEDEX DATA</span>
                            <span id="card-counter">เหลือ: 0</span>
                        </div>

                        <!-- คำศัพท์หลัก -->
                        <div class="main-word-display" id="display-col1"></div>
                        
                        <!-- ปุ่มฟังเสียงภาษาจีน -->
                        <button id="btn-speak" class="speak-btn" onclick="speakChinese()">🔊 ฟังเสียง</button>

                        <!-- ข้อมูลที่ถูกซ่อน -->
                        <div class="translation-box" id="display-details">
                            <div class="data-row">
                                <span class="data-label" style="background:#3b82f6;">คำอ่าน</span>
                                <span class="data-val" id="display-col2"></span>
                            </div>
                            <div class="data-row">
                                <span class="data-label" style="background:#eab308; color:black;">ประเภท</span>
                                <span class="data-val" id="display-col3"></span>
                            </div>
                            <div class="data-row">
                                <span class="data-label" style="background:#ef4444;">ข้อมูล</span>
                                <span class="data-val" id="display-col4"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pokedex-controls">
                    <button id="btn-show-trans" class="action-btn btn-scan" onclick="showTranslation()">กดเพื่อสแกนข้อมูล 📡</button>
                    
                    <div class="battle-actions" id="action-buttons">
                        <button class="action-btn btn-catch" onclick="markWord(true)">จับได้แล้ว! (จำได้)</button>
                        <button class="action-btn btn-run" onclick="markWord(false)">หนีไป.. (จำไม่ได้)</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let appData = JSON.parse(localStorage.getItem('pkmnWordData')) || { chapters: [], words: [] };
        let currentStudyPool = [];
        let currentWordIndex = -1;
        let lastShownIndex = -1;

        function switchTab(tab) {
            document.getElementById('admin-container').classList.remove('active');
            document.getElementById('study-container').classList.remove('active');
            document.querySelectorAll('.tab-btn')[0].classList.remove('active');
            document.querySelectorAll('.tab-btn')[1].classList.remove('active');

            if (tab === 'admin') {
                document.getElementById('admin-container').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            } else {
                document.getElementById('study-container').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                updateDropdowns(); 
            }
        }

        function addChapter() {
            const chapterName = document.getElementById('chapterName').value.trim();
            if (!chapterName) {
                Swal.fire({ icon: 'warning', title: 'ข้อความระบบ', text: 'กรุณาตั้งชื่อกล่องเก็บเด็ค (PC Box) ก่อนนะ!' });
                return;
            }
            
            const newChapter = { id: Date.now().toString(), name: chapterName };
            appData.chapters.push(newChapter);
            saveData();
            document.getElementById('chapterName').value = '';
            updateDropdowns();
            Swal.fire({ icon: 'success', title: 'สำเร็จ!', text: 'สร้างกล่องเด็คใหม่เรียบร้อยแล้ว', timer: 1500, showConfirmButton: false });
        }

        function deleteChapter(chapterId, chapterName) {
            Swal.fire({
                title: 'แน่ใจหรือไม่?',
                text: `คุณต้องการลบกล่อง "${chapterName}" ทิ้งใช่ไหม?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#cc0000',
                confirmButtonText: 'ลบเลย!',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    appData.chapters = appData.chapters.filter(ch => ch.id !== chapterId);
                    appData.words = appData.words.filter(w => w.chapterId !== chapterId);
                    saveData();
                    updateDropdowns();
                    Swal.fire({ icon: 'success', title: 'ลบสำเร็จ!', timer: 1500, showConfirmButton: false });
                }
            });
        }

        function updateDropdowns() {
            const adminSelect = document.getElementById('chapterSelectAdmin');
            const studySelect = document.getElementById('chapterSelectStudy');
            const deckListAdmin = document.getElementById('deckListAdmin');
            
            adminSelect.innerHTML = '<option value="">-- กรุณาเลือกกล่องเด็ค --</option>';
            studySelect.innerHTML = '<option value="">-- กรุณาเลือกกล่องเด็ค --</option>';
            deckListAdmin.innerHTML = '';

            appData.chapters.forEach(ch => {
                adminSelect.innerHTML += `<option value="${ch.id}">${ch.name}</option>`;
                studySelect.innerHTML += `<option value="${ch.id}">${ch.name}</option>`;
                
                const wordCount = appData.words.filter(w => w.chapterId === ch.id).length;
                deckListAdmin.innerHTML += `
                    <div class="deck-item">
                        <span><strong>${ch.name}</strong> <small>(${wordCount} ข้อมูล)</small></span>
                        <button class="btn-del-deck" onclick="deleteChapter('${ch.id}', '${ch.name}')">ลบ</button>
                    </div>`;
            });
        }

        function addTableRow() {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align:center;">-</td>
                <td><input type="text" class="in-col1" placeholder="เช่น 你好" onpaste="handlePasteOnInput(event, this)"></td>
                <td><input type="text" class="in-col2" placeholder="nǐ hǎo"></td>
                <td><input type="text" class="in-col3" placeholder="คำทักทาย"></td>
                <td><input type="text" class="in-col4" placeholder="สวัสดี"></td>
                <td style="text-align:center;"><button class="btn-del-row" onclick="removeRow(this)">✕</button></td>
            `;
            tbody.appendChild(tr);
            updateRowNumbers();
        }

        function addMultipleRows(count) { for(let i = 0; i < count; i++) addTableRow(); }
        function removeRow(btn) { btn.closest('tr').remove(); updateRowNumbers(); }
        
        function updateRowNumbers() {
            document.querySelectorAll('#tableBody tr').forEach((row, index) => {
                row.children[0].innerText = index + 1;
            });
        }

        function clearEmptyRows() {
            document.querySelectorAll('#tableBody tr').forEach(row => {
                if (!row.querySelector('.in-col1').value.trim()) row.remove();
            });
            updateRowNumbers();
        }

        function handlePasteOnInput(e, inputElem) {
            const clip = (e.clipboardData || window.clipboardData).getData('text');
            if (clip && clip.includes('\t')) {
                e.preventDefault();
                const lines = clip.trim().split('\n');
                let targetRow = inputElem.closest('tr');

                lines.forEach(line => {
                    const cols = line.split('\t');
                    if (cols.length >= 2 && targetRow) {
                        targetRow.querySelector('.in-col1').value = cols[0] || '';
                        targetRow.querySelector('.in-col2').value = cols[1] || '';
                        targetRow.querySelector('.in-col3').value = cols[2] || '';
                        targetRow.querySelector('.in-col4').value = cols[3] || '';
                        targetRow = targetRow.nextElementSibling;
                    }
                });
            }
        }

        function saveTableWords() {
            const chapterId = document.getElementById('chapterSelectAdmin').value;
            if (!chapterId) return Swal.fire({ icon: 'warning', text: 'เลือกกล่องเด็คก่อนนะ!' });

            let savedCount = 0;
            document.querySelectorAll('#tableBody tr').forEach(row => {
                const col1 = row.querySelector('.in-col1').value.trim();
                if (col1) {
                    appData.words.push({ 
                        chapterId, 
                        col1: col1, 
                        col2: row.querySelector('.in-col2').value.trim(), 
                        col3: row.querySelector('.in-col3').value.trim(), 
                        col4: row.querySelector('.in-col4').value.trim(),
                        cn: col1 // รองรับข้อมูลเก่า
                    });
                    savedCount++;
                }
            });

            if (savedCount > 0) {
                saveData();
                document.getElementById('tableBody').innerHTML = '';
                addMultipleRows(3);
                updateDropdowns(); 
                Swal.fire({ icon: 'success', text: `บันทึกข้อมูล ${savedCount} รายการ สำเร็จ!` });
            }
        }

        function saveData() { localStorage.setItem('pkmnWordData', JSON.stringify(appData)); }

        // --- Pokedex & Text-to-Speech ---
        function startStudy() {
            const chapterId = document.getElementById('chapterSelectStudy').value;
            if (!chapterId) return Swal.fire({ icon: 'info', text: 'เลือกกล่องเด็คก่อน' });

            currentStudyPool = appData.words.filter(w => w.chapterId === chapterId);
            if (currentStudyPool.length === 0) return Swal.fire({ icon: 'warning', text: 'กล่องว่างเปล่า!' });

            document.getElementById('study-area').style.display = 'flex';
            lastShownIndex = -1;
            nextRandomWord();
        }

        function nextRandomWord() {
            if (currentStudyPool.length === 0) {
                document.getElementById('study-area').style.display = 'none';
                return Swal.fire({ icon: 'success', title: 'Master!', text: 'คุณจดจำข้อมูลทั้งหมดได้แล้ว!' });
            }

            document.getElementById('card-counter').innerText = `เหลือข้อมูล: ${currentStudyPool.length}`;

            let randIdx = Math.floor(Math.random() * currentStudyPool.length);
            if (currentStudyPool.length > 1 && randIdx === lastShownIndex) {
                randIdx = (randIdx + 1) % currentStudyPool.length;
            }
            
            currentWordIndex = randIdx;
            lastShownIndex = currentWordIndex;
            const word = currentStudyPool[currentWordIndex];

            document.getElementById('display-col1').innerText = word.col1 || word.cn || '-';
            document.getElementById('display-col2').innerText = word.col2 || word.pin || '-';
            document.getElementById('display-col3').innerText = word.col3 || word.thRead || '-';
            document.getElementById('display-col4').innerText = word.col4 || word.thMean || '-';
            
            // แสดงปุ่มฟังเสียง
            document.getElementById('btn-speak').style.display = 'block';

            document.getElementById('display-details').style.display = 'none';
            document.getElementById('btn-show-trans').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'none';
        }

        function showTranslation() {
            document.getElementById('display-details').style.display = 'block';
            document.getElementById('btn-show-trans').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'flex';
        }

        function markWord(isRemembered) {
            if (isRemembered) {
                currentStudyPool.splice(currentWordIndex, 1);
                lastShownIndex = -1; 
            }
            nextRandomWord();
        }

        // ฟังก์ชันอ่านออกเสียงภาษาจีน (Text to Speech)
        function speakChinese() {
            const word = document.getElementById('display-col1').innerText;
            if (!word || word === '-') return;
            
            // ใช้ Web Speech API เพื่ออ่านออกเสียงเป็นภาษาจีนตัวย่อ (zh-CN)
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'zh-CN'; 
            utterance.rate = 0.9; // ปรับความเร็วให้อ่านช้าลงนิดนึงเพื่อให้ฟังง่าย
            window.speechSynthesis.speak(utterance);
        }

        updateDropdowns();
        addMultipleRows(5);
    </script>
</body>
</html>
